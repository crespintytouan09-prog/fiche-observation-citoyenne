  <title>Fiche d’observation citoyenne</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #1e4fa3;
      margin: 0;
      color: #333;
    }
    .container {
      max-width: 800px;
      margin: auto;
      padding: 16px;
    }
    .logos {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 24px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .logos img {
      max-height: 90px;
      width: auto;
      background: #ffffff;
      padding: 6px;
      border-radius: 6px;
    }
    h1 {
      text-align: center;
      font-size: 1.6rem;
      color: #ffffff;
      margin: 8px 0 16px;
    }
    .section {
      background: #ffffff;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }
    .section h2 {
      font-size: 1.1rem;
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 0.9rem;
      margin-top: 8px;
    }
    input, textarea, select {
      width: 100%;
      padding: 10px;
      margin-top: 4px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 1rem;
    }
    textarea {
      resize: vertical;
      min-height: 80px;
    }
    button {
      width: 100%;
      padding: 12px;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      background: #0b2f6b;
      color: #fff;
      cursor: pointer;
    }
    button:hover {
      background: #082552;
    }
    footer {
      text-align: center;
      font-size: 0.8rem;
      margin-top: 16px;
      color: #e8ecf5;
    }
  </style>

    <h1>Enquête citoyenne</h1>

    <form>
      <div class="section">
        <h2>1. Vos coordonnées</h2>
        <label for="nom">Nom / Prénom</label>
        <input type="text" id="nom" name="nom" />
        <label for="contact">Contact</label>
        <input type="text" id="contact" name="contact" />
      </div>

      <div class="section">
        <h2>2. Où et quand ?</h2>
        <label for="date">Date</label>
        <input type="date" id="date" name="date" />
        <label for="heure">Heure</label>
        <input type="time" id="heure" name="heure" />
        <label for="lieu">Lieu</label>
        <input type="text" id="lieu" name="lieu" />
      </div>

      <div class="section">
        <h2>3. Observation</h2>
        <label for="nombre">Nombre d’individus</label>
        <input type="number" id="nombre" name="nombre" min="1" />
      </div>

      <div class="section">
        <h2>4. Remarques</h2>
        <textarea name="commentaire" placeholder="Commentaires complémentaires..."></textarea>
      </div>

      <button type="submit">Envoyer l’observation</button>
    </form>

    <footer>
      Fiche d’observation citoyenne – compatible iOS, Android et ordinateur
    </footer>
  </div>
